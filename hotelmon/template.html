<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房價日曆</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d2327; --muted:#6b7378; --line:#e6e3dd;
  --accent:#0f6e6e; --low:#d7efec; --lowest:#0f6e6e; --lowest-ink:#ffffff;
  --up:#c46a12; --down:#1f8a4c; --sold:#b8860b; --weekend:#2a6fb0; --chip:#ecebe6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121517; --card:#1b1f22; --ink:#e8ebec; --muted:#9aa3a8; --line:#2a3034;
    --accent:#4fb3ad; --low:#1d3a38; --lowest:#2c8f89; --lowest-ink:#ffffff;
    --up:#e3954a; --down:#58c486; --sold:#d9b24c; --weekend:#79b2e8; --chip:#252a2e;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 0;margin:0 -16px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.upd{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:10px 0;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.sum .name{font-size:18px;font-weight:600}
.sum .meta{color:var(--muted);font-size:13px}
.sum .best{text-align:right}
.sum .best b{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.month h2{font-size:16px;margin:22px 0 8px;text-align:center;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.dow.we{color:var(--weekend)}
.cell{min-height:64px;border-radius:8px;padding:5px 1px 4px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;background:none;font:inherit;color:inherit}
.cell.empty{cursor:default}
.cell .d{font-size:15px}
.cell.we .d{color:var(--weekend)}
.cell .p{font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cell .c{font-size:11px;font-variant-numeric:tabular-nums}
.cell.low{background:var(--low)}
.cell.lowest{background:var(--lowest);color:var(--lowest-ink)}
.cell.lowest .d,.cell.lowest .c,.cell.lowest .c span{color:var(--lowest-ink)!important}
.cell.mon{border-color:var(--accent)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.up{color:var(--up)} .down{color:var(--down)} .sold{color:var(--sold)}
.na{color:var(--muted)}
/* 明細 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s ease;
  max-width:720px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.sheet.open{transform:none}
.sheet .row{display:flex;justify-content:space-between;align-items:baseline}
.sheet .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet svg{width:100%;height:80px;margin:10px 0 4px;display:block}
.sheet .hist{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
/* 監控、優惠 */
.mon-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mon-item:last-child{border-bottom:0}
.mon-item .t{font-weight:600}
.mon-item .s{color:var(--muted);font-size:13px}
.tag{font-size:13px;align-self:center;text-align:right}
.tag.watch{color:var(--down)} .tag.done{color:#c0392b} .tag.expired{color:var(--muted)}
.deal{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.deal:last-child{border-bottom:0}
.deal small{display:block;color:var(--muted);margin-top:2px}
.empty-note{color:var(--muted);text-align:center;padding:24px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>房價日曆</h1><span class="upd" id="upd"></span></div>
    <nav class="tabs">
      <button class="tab on" data-v="cal">每日房價</button>
      <button class="tab" data-v="mon">我的監控</button>
      <button class="tab" data-v="deal">優惠情報</button>
    </nav>
  </header>

  <section id="v-cal">
    <div class="chips" id="chips"></div>
    <div class="card sum" id="sum"></div>
    <div class="legend">
      <span><i style="background:var(--lowest)"></i>最低</span>
      <span><i style="background:var(--low)"></i>偏低</span>
      <span class="up">漲</span><span class="down">降、新開</span><span class="sold">搶空</span>
      <span>框線＝監控中</span><span>與前次抓取比較</span>
    </div>
    <div id="cal"></div>
  </section>

  <section id="v-mon" class="hide"><div class="card" id="mon"></div></section>
  <section id="v-deal" class="hide"><div class="card" id="deal"></div></section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false"></div>

<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (p,u) => p==null ? "-" : (u==="pts" ? p.toLocaleString()+" 點" : (u||"")+" "+p.toLocaleString());
const short = p => p==null ? "" : String(p);
let cur = 0, selDay = null;
try { const k = localStorage.getItem("hm-hotel"); const i = DATA.hotels.findIndex(h=>h.id===k); if (i>=0) cur=i; } catch(e){}

$("#upd").textContent = "更新 " + DATA.updated;

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x===b));
  ["cal","mon","deal"].forEach(v => $("#v-"+v).classList.toggle("hide", v!==b.dataset.v));
  closeSheet();
});

function chips(){
  $("#chips").innerHTML = DATA.hotels.map((h,i) =>
    `<button class="chip ${i===cur?"on":""}" data-i="${i}">${esc(h.name)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    cur = +c.dataset.i; try{localStorage.setItem("hm-hotel", DATA.hotels[cur].id)}catch(e){}
    closeSheet(); render();
  });
}

function render(){
  chips();
  const h = DATA.hotels[cur];
  if (!h){ $("#cal").innerHTML = '<p class="empty-note">尚無資料，請先執行 python run.py daily</p>'; $("#sum").innerHTML=""; return; }
  const days = h.days, keys = Object.keys(days).sort();
  const ok = keys.filter(k => days[k].s==="ok" && days[k].p!=null);
  const prices = ok.map(k => days[k].p);
  const min = Math.min(...prices), max = Math.max(...prices);
  const lowCut = min + (max-min)*0.2;
  const best = ok.filter(k => days[k].p===min);
  const unit = ok.length ? days[ok[0]].u : "pts";
  const monDates = new Set(DATA.monitors.filter(m=>m.hotel===h.id && m.state==="watch").map(m=>m.date));
  $("#sum").innerHTML = `
    <div><div class="name">${esc(h.name)}</div><div class="meta">${esc(h.chain)}${h.city?" · "+esc(h.city):""} · 抓取 ${esc(h.last||"-")}</div></div>
    <div class="best">${ok.length?`<div class="meta">區間最低</div><b>${fmt(min,unit)}</b><div class="meta">${best.slice(0,3).map(d=>d.slice(5)).join("、")}${best.length>3?" 等":""}</div>`:""}</div>`;
  if (!keys.length){ $("#cal").innerHTML = '<p class="empty-note">這間還沒有資料</p>'; return; }

  // 依月份分組
  const first = new Date(keys[0]+"T00:00"), last = new Date(keys[keys.length-1]+"T00:00");
  let html = "";
  for (let y=first.getFullYear(), m=first.getMonth(); y<last.getFullYear() || (y===last.getFullYear() && m<=last.getMonth()); m===11?(y++,m=0):m++){
    html += `<div class="month"><h2>${y} 年 ${m+1} 月</h2><div class="grid">`;
    html += ["日","一","二","三","四","五","六"].map((w,i)=>`<div class="dow ${i===0||i===6?"we":""}">${w}</div>`).join("");
    const start = new Date(y,m,1).getDay(), n = new Date(y,m+1,0).getDate();
    for (let i=0;i<start;i++) html += '<div class="cell empty"></div>';
    for (let d=1; d<=n; d++){
      const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const wd = (start+d-1)%7, we = wd===0||wd===6, x = days[key];
      let cls = "cell"+(we?" we":"")+(monDates.has(key)?" mon":"")+(key===selDay?" sel":"");
      let p = "", c = "";
      if (x){
        if (x.s==="sold_out"){ c = '<span class="sold">搶空</span>'; }
        else if (x.p!=null){
          p = short(x.p);
          if (x.p===min) cls += " lowest"; else if (x.p<=lowCut) cls += " low";
          if (x.new) c = '<span class="down">新開</span>';
          else if (x.delta>0) c = `<span class="up">漲${x.delta.toLocaleString()}</span>`;
          else if (x.delta<0) c = `<span class="down">降${(-x.delta).toLocaleString()}</span>`;
        }
      } else cls += " na";
      html += x ? `<button class="${cls}" data-k="${key}"><span class="d">${d}</span><span class="p">${p}</span><span class="c">${c}</span></button>`
                : `<div class="${cls} empty"><span class="d">${d}</span></div>`;
    }
    html += "</div></div>";
  }
  $("#cal").innerHTML = html;
  document.querySelectorAll(".cell[data-k]").forEach(b => b.onclick = () => openSheet(b.dataset.k));
}

function spark(hist){
  const pts = hist.filter(r=>r[2]==="ok" && r[1]!=null);
  if (pts.length<2) return "";
  const vs = pts.map(r=>r[1]), lo=Math.min(...vs), hi=Math.max(...vs), W=300, H=70, pad=6;
  const xy = pts.map((r,i)=>[pad+i*(W-2*pad)/(pts.length-1), H-pad-(hi===lo?0.5:(r[1]-lo)/(hi-lo))*(H-2*pad)]);
  const d = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const lp = xy[xy.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="價格走勢">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}

function openSheet(k){
  selDay = k; render();
  const h = DATA.hotels[cur], x = h.days[k];
  const wd = "日一二三四五六"[new Date(k+"T00:00").getDay()];
  const mon = DATA.monitors.find(m=>m.hotel===h.id && m.date===k);
  let change = "";
  if (x.new) change = '<span class="down">由搶空轉為有房</span>';
  else if (x.delta>0) change = `<span class="up">較前次漲 ${x.delta.toLocaleString()}</span>`;
  else if (x.delta<0) change = `<span class="down">較前次降 ${(-x.delta).toLocaleString()}</span>`;
  const hist = x.h.slice(-6).reverse().map(r=>`${r[0].slice(5)}　${r[2]==="sold_out"?"搶空":fmt(r[1],x.u)}`).join("<br>");
  $("#sheet").innerHTML = `
    <div class="row"><div><b>${esc(h.name)}</b><div class="hist">${k}（${wd}）入住 1 晚</div></div>
      <div class="big">${x.s==="sold_out"?'<span class="sold">搶空</span>':fmt(x.p,x.u)}</div></div>
    <div class="row" style="margin-top:4px"><span class="hist">${mon?`監控門檻 < ${mon.max.toLocaleString()}（${mon.state==="done"?"已完成":"監控中"}）`:"未設監控"}</span>${change}</div>
    ${spark(x.h)}
    <div class="hist">${hist}</div>
    <div class="btns">${x.url?`<a class="btn pri" href="${esc(x.url)}" target="_blank" rel="noopener">前往官網</a>`:""}<button class="btn" onclick="closeSheet()">關閉</button></div>`;
  $("#sheet").classList.add("open");
}
function closeSheet(){ $("#sheet").classList.remove("open"); if (selDay){ selDay=null; render(); } }

function renderMon(){
  const st = {watch:"監控中", done:"已完成", expired:"已過期"};
  $("#mon").innerHTML = DATA.monitors.length ? DATA.monitors.map(m => `
    <div class="mon-item">
      <div class="t">${esc(m.date)}　${esc(m.name)}</div>
      <div class="tag ${m.state}">${st[m.state]}</div>
      <div class="s">門檻 < ${m.max.toLocaleString()}　目前 ${m.s==="sold_out"?"搶空":fmt(m.cur,m.unit)}</div>
      <div class="s" style="text-align:right">${m.done_at?"完成 "+esc(m.done_at.slice(5)):""}</div>
    </div>`).join("") : '<p class="empty-note">尚未設定監控，請在 config.yaml 的 monitors 新增</p>';
}
function renderDeals(){
  $("#deal").innerHTML = DATA.deals.length ? DATA.deals.map(d => `
    <a class="deal" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.title)}<small>${esc(d.source)} · ${esc(d.seen)}</small></a>`).join("")
    : '<p class="empty-note">目前沒有符合關鍵字的優惠文章</p>';
}
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });
render(); renderMon(); renderDeals();
</script>
</body>
</html>
