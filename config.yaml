# 雲端（GitHub Actions）用設定。Telegram 金鑰放在 repo 的 Secrets，不寫在這裡。
db_path: data/hotelmon.db
data_dir: data
output_dir: dist
days_ahead: 60
adults: 2

browser:
  headless: false        # 雲端用 xvfb 虛擬螢幕，降低被判定為機器人
  channel: chrome
  profile_dir: data/browser-profile
  locale: en-US
  delay_seconds: [3, 6]
  page_timeout: 45

hotels:
  - id: nagoya-marriott
    name: 名古屋萬豪
    chain: marriott
    code: NGODT
    city: 名古屋
    mode: points
    alert_drop: true
    drop_min: 2000

  - id: ic-taipei
    name: 台北洲際
    chain: ihg
    code: TPEPI
    city: 台北
    mode: points
    alert_drop: true
    drop_min: 2000

monitors:
  - hotel: nagoya-marriott
    date: 2026-11-28
    max_price: 60000
  - hotel: ic-taipei
    date: 2026-12-06
    max_price: 65000

deals:
  feeds:
    - https://loyaltylobby.com/feed/
    - https://onemileatatime.com/feed/
    - https://thepointsguy.com/feed/
  keywords: [marriott, bonvoy, ihg, hyatt, accor, flash sale, points sale, promotion, japan, taiwan, taipei, tokyo, nagoya]
  exclude: [credit card review]
