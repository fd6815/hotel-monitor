# 房價監控設定（在你的電腦上執行）
db_path: data/hotelmon.db
data_dir: data
output_dir: dist
days_ahead: 60          # 每日日曆抓未來幾天
adults: 2

browser:
  # exe: C:\Program Files\Google\Chrome\Application\chrome.exe   # 自動偵測，找不到再手動填
  profile_dir: data/chrome-profile   # 程式專用 Chrome 設定檔（不影響你平常的 Chrome）
  offscreen: true       # 視窗開在螢幕外，不干擾你使用電腦
  delay_seconds: [12, 20]  # 萬豪每次查詢間隔，太快會被暫時封鎖
  page_timeout: 45

# 手機看日曆：上傳到 GitHub，網址 https://fd6815.github.io/hotel-monitor/
github:
  repo: fd6815/hotel-monitor
  path: site/index.html
  branch: main
  # token 放在 data/github_token.txt（一行），不要寫在這裡

# 通知（選填）
telegram:
  bot_token: ""
  chat_id: ""

hotels:
  - id: nagoya-marriott
    name: 名古屋萬豪
    chain: marriott
    code: NGODT
    city: 名古屋
    mode: points
    standard_max: 90000   # 超過視為標準房搶空（只剩 Club／套房）
    alert_drop: true
    drop_min: 2000

  - id: ic-taipei
    name: 台北洲際
    chain: ihg
    code: TPEPI
    ihg_path: intercontinental/hotels/us/en/taipei/tpepi
    city: 台北
    mode: points
    alert_drop: true
    drop_min: 2000

monitors:               # 指定日期，低於門檻通知一次後轉為「已完成」
  - hotel: nagoya-marriott
    date: 2026-11-28
    max_price: 60000
  - hotel: ic-taipei
    date: 2026-12-06
    max_price: 65000

deals:   # 篩選規則在 hotelmon/deals.py
  feeds:
    - https://loyaltylobby.com/feed/
    - https://onemileatatime.com/feed/
    - https://thepointsguy.com/feed/
    - https://blog.tripplus.cc/zh/feed
    - https://vocus.cc/api/rss/user/683333f5fd89780001609ced/articles   # 方格子「旅程任意門」
