name: 發布日曆頁

# 你的電腦抓完房價後會上傳 site/index.html，這裡負責部署到 GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub 偶爾剛上傳完還查不到 artifact（No artifacts named "github-pages"），等一下再試
      - id: d
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v5
