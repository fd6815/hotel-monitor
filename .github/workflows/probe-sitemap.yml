name: 測試 sitemap
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" -m 30 https://www.marriott.com/sitemap-index.xml -o idx.xml; echo "IDX $(wc -c < idx.xml)"; grep -o '<loc>[^<]*</loc>' idx.xml | head -80
          for s in $(grep -o '<loc>[^<]*</loc>' idx.xml | sed 's/<[^>]*>//g' | grep -i -E 'hotel|property|en-us' | head -4); do
            echo "=== $s"; curl -sSL -A "$UA" -m 60 "$s" -o s.xml; echo "size $(wc -c < s.xml)"; grep -o '<loc>[^<]*</loc>' s.xml | head -15; grep -c '<loc>' s.xml
          done
