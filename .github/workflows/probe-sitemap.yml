name: 測試 sitemap
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" -m 60 https://www.marriott.com/en-us/hotel-sitemap/taiwan-hotel-sitemap -o tw.html; echo "TW $(wc -c < tw.html)"
          python3 - <<'PY'
          import re
          s=open('tw.html',encoding='utf-8',errors='ignore').read()
          links=re.findall(r'href="([^"]*/hotels/[a-z0-9]{5}-[^"]*)"',s)
          print(len(links)); print(links[:5])
          i=s.find(links[0]) if links else 0
          print(s[max(0,i-1500):i+600])
          PY
          curl -sSL -A "$UA" -m 60 https://www.marriott.com/content/dam/marriott-hws/sitemap-xmls/us-sitemap-hws-1.xml -o h.xml; echo "HWS $(wc -c < h.xml)"; grep -o '<loc>[^<]*</loc>' h.xml | head -8; grep -c '<loc>' h.xml
