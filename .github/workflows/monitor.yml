name: 房價監控

on:
  schedule:
    - cron: "13 23,11 * * *"   # 台北 07:13、19:13：完整日曆
    - cron: "43 */2 * * *"     # 每 2 小時：只查監控日期
  workflow_dispatch:
    inputs:
      cmd:
        description: daily / watch / deals / report
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 決定指令
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then c="${{ inputs.cmd }}";
          elif [ "${{ github.event.schedule }}" = "13 23,11 * * *" ]; then c=daily; else c=watch; fi
          echo "cmd=$c" >> "$GITHUB_OUTPUT"
      - name: 抓價與通知
        env:
          TZ: Asia/Taipei
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a python run.py ${{ steps.cmd.outputs.cmd }} -c config.yaml
          python run.py report -c config.yaml
      - name: 儲存資料庫
        if: always()
        run: |
          git config user.name "hotel-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hotelmon.db || true
          git diff --cached --quiet || (git commit -m "data: ${{ steps.cmd.outputs.cmd }} $(TZ=Asia/Taipei date '+%F %R')" && git pull --rebase -X ours && git push)
      - name: 上傳除錯截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: dist

  deploy:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
