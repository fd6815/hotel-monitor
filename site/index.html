<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>房價監控</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d2327; --muted:#6b7378; --line:#e6e3dd;
  --accent:#0f6e6e; --accent-ink:#ffffff; --low:#d7efec; --lowest:#0f6e6e;
  --up:#c46a12; --down:#1f8a4c; --sold:#b8860b; --weekend:#2a6fb0; --chip:#ecebe6; --danger:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121517; --card:#1b1f22; --ink:#e8ebec; --muted:#9aa3a8; --line:#2a3034;
    --accent:#4fb3ad; --accent-ink:#0b1416; --low:#1d3a38; --lowest:#2c8f89;
    --up:#e3954a; --down:#58c486; --sold:#d9b24c; --weekend:#79b2e8; --chip:#252a2e; --danger:#ef6b5b;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 24px}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:.02em}
.upd{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;margin:0 -0px 4px}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:0 16px 6px}
.cell .p b{font-weight:800}
.cell .q{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cell.lowest .q{color:#fff}
.good{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:none;padding:6px;cursor:pointer;color:var(--muted);display:flex}
.iconbtn svg{width:22px;height:22px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:12px;cursor:pointer}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sec-title{font-size:15px;font-weight:600;margin:20px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-weight:400;color:var(--muted);font-size:12px}
.search{display:flex;gap:8px;margin-top:4px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
.search input:focus{border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:4px;vertical-align:1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.empty-note{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.sum .name{font-size:18px;font-weight:600}
.sum .meta{color:var(--muted);font-size:12.5px}
.sum .best{text-align:right}
.sum .best b{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.monthbar h2{font-size:17px;margin:0;font-weight:600}
.monthbar button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:36px;font-size:18px;cursor:pointer}
.monthbar button:disabled{opacity:.3;cursor:default}
.status{font-size:13px;color:var(--muted);margin:6px 0 2px;min-height:18px}
.status.busy{color:var(--accent)}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.cell .p.na{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.dow.we{color:var(--weekend)}
.cell{min-width:0;overflow:hidden;min-height:62px;border-radius:8px;padding:5px 1px 4px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;background:none}
.cell.blank{cursor:default}
.cell .d{font-size:15px}
.cell.we .d{color:var(--weekend)}
.cell .p{font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cell .c{font-size:11px;font-variant-numeric:tabular-nums}
.cell.past{opacity:.35;cursor:default}
.cell.low{background:var(--low)}
.cell.lowest{background:var(--lowest);color:#fff}
.cell.lowest .d,.cell.lowest .c,.cell.lowest .c span{color:#fff!important}
.cell.mon{border-color:var(--accent);border-width:2px}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.up{color:var(--up)} .down{color:var(--down)} .sold{color:var(--sold)} .muted{color:var(--muted)}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s ease;
  max-width:720px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet.open{transform:none}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet svg.spark{width:100%;height:70px;margin:10px 0 4px;display:block}
.hist{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1;text-align:center;padding:10px;text-decoration:none}
.field{display:flex;align-items:center;gap:8px;margin-top:12px}
.field label{color:var(--muted);font-size:13px;white-space:nowrap}
.field input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-variant-numeric:tabular-nums}
.tag{font-size:13px;white-space:nowrap}
.tag.watch{color:var(--down)} .tag.done{color:var(--danger)} .tag.expired{color:var(--muted)} .tag.pending{color:var(--muted)}
.toggle{position:relative;width:42px;height:24px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--chip);border-radius:999px;transition:.15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{left:21px}
.deal{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.deal:last-child{border-bottom:0}
.deal small{display:block;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:.95}
.banner{background:var(--low);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.banner a{color:var(--accent)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <header style="position:static;margin:0;padding:12px 0 8px">
    <h1 id="title">房價監控</h1>
    <span class="upd" id="upd"></span>
    <button class="iconbtn" id="btnSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="seg" id="pmode" role="tablist" aria-label="價格顯示">
    <button data-m="points">點數</button><button data-m="cash">現金</button><button data-m="both">點數＋現金</button>
  </div>
  </div>

  <!-- 搜尋／收藏 -->
  <section id="v-home">
    <div class="search">
      <input id="q" type="search" placeholder="城市、品牌或飯店名（例：名古屋萬豪）" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="seg" id="dirchain" role="tablist" aria-label="集團">
      <button data-c="all">全部</button><button data-c="marriott">萬豪</button><button data-c="ihg">洲際</button>
    </div>
    <div class="hint" id="qhint">中文名稱由城市＋品牌組成，僅供參考。也可輸入 5 碼代碼或貼上官網網址</div>
    <div class="card hide" id="results"></div>
    <div class="sec-title">我的收藏 <small id="favcount"></small></div>
    <div class="card" id="favs"></div>
  </section>

  <!-- 日曆 -->
  <section id="v-cal" class="hide">
    <div class="chips" id="chips"></div>
    <div class="card sum" id="sum"></div>
    <div class="legend">
      <span><i style="background:var(--lowest)"></i>最低</span><span><b>粗體</b>＝點數划算</span><span>現金為台幣未稅</span>
      <span><i style="background:var(--low)"></i>偏低</span>
      <span class="up">漲</span><span class="down">降、新開</span><span class="sold">搶空</span>
      <span>粗框＝監控中</span><span>點日期可加監控</span><span>60 天後的月份切換時才查詢</span>
    </div>
    <div class="status" id="status"></div>
    <div id="cal"></div>
  </section>

  <!-- 監控 -->
  <section id="v-mon" class="hide">
    <div class="hint">在「日曆」點日期即可新增監控；價格低於門檻時傳 LINE 通知一次，並標為已完成。</div>
    <div class="card" id="mon"></div>
  </section>

  <!-- 優惠 -->
  <section id="v-deal" class="hide">
    <div class="card" id="deal"></div>
  </section>
</div>

<nav class="tabbar">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜尋收藏</button>
  <button data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>每日房價</button>
  <button data-v="mon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>我的監控</button>
  <button data-v="deal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>優惠情報</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 設定 ---------- */
const REPO = "fd6815/hotel-monitor";
const WL_PATH = "watch/watchlist.json";
const DAYS_AHEAD = 60;
const MAX_MONTHS = 12;
const REQ_PATH = "watch/requests.json";
const EMBED = null/*__DATA__*/;
const CHAIN = {marriott:"萬豪", ihg:"IHG", hyatt:"凱悅", accor:"雅高"};
const IHG_BRAND = {intercontinental:"InterContinental", holidayinn:"Holiday Inn", holidayinnexpress:"Holiday Inn Express", holidayinnresorts:"Holiday Inn Resort",
  holidayinnclubvacations:"Holiday Inn Club Vacations", "holiday-inn-the-niu":"Holiday Inn The Niu", crowneplaza:"Crowne Plaza", candlewood:"Candlewood Suites", staybridge:"Staybridge Suites",
  hotelindigo:"Hotel Indigo", voco:"voco", kimptonhotels:"Kimpton", evenhotels:"EVEN Hotels", avidhotels:"avid hotels", atwellsuites:"Atwell Suites", vignettecollection:"Vignette Collection",
  regent:"Regent", armyhotels:"IHG Army Hotels", spnd:"IHG", "joia-iberostar":"Iberostar JOIA", "noted-collection":"Noted Collection"};

/* 中文搜尋對照：城市（含機場代碼）、品牌 */
const ALIAS = {
  "名古屋":["nagoya","NGO"],"東京":["tokyo","TYO"],"东京":["tokyo","TYO"],"大阪":["osaka","OSA"],"京都":["kyoto","UKY"],
  "札幌":["sapporo","SPK"],"北海道":["hokkaido","niseko","sapporo"],"沖繩":["okinawa","OKA"],"冲绳":["okinawa","OKA"],
  "福岡":["fukuoka","FUK"],"神戶":["kobe","UKB"],"橫濱":["yokohama","YOK"],"奈良":["nara"],"廣島":["hiroshima","HIJ"],
  "箱根":["hakone"],"富士":["fuji"],"河口湖":["kawaguchiko","fuji"],"輕井澤":["karuizawa"],"金澤":["kanazawa"],"日光":["nikko"],
  "台北":["taipei","TPE"],"臺北":["taipei","TPE"],"台中":["taichung","RMQ"],"臺中":["taichung","RMQ"],"高雄":["kaohsiung","KHH"],
  "台南":["tainan","TNN"],"臺南":["tainan","TNN"],"新北":["new taipei","taipei"],"桃園":["taoyuan"],"宜蘭":["yilan"],"花蓮":["hualien","HUN"],"墾丁":["kenting"],
  "首爾":["seoul","SEL"],"首尔":["seoul","SEL"],"釜山":["busan","PUS"],"濟州":["jeju","CJU"],
  "曼谷":["bangkok","BKK"],"普吉":["phuket","HKT"],"清邁":["chiang mai","CNX"],"清迈":["chiang mai","CNX"],"芭達雅":["pattaya"],"蘇美":["samui","USM"],
  "新加坡":["singapore","SIN"],"吉隆坡":["kuala lumpur","KUL"],"峇里":["bali","DPS"],"巴厘":["bali","DPS"],"雅加達":["jakarta","JKT"],
  "河內":["hanoi","HAN"],"河内":["hanoi","HAN"],"胡志明":["ho chi minh","saigon","SGN"],"峴港":["da nang","DAD"],"岘港":["da nang","DAD"],"富國島":["phu quoc","PQC"],
  "馬尼拉":["manila","MNL"],"宿霧":["cebu","CEB"],"長灘島":["boracay"],
  "香港":["hong kong","HKG"],"澳門":["macau","MFM"],"澳门":["macau","MFM"],"上海":["shanghai","SHA"],"北京":["beijing","BJS"],
  "深圳":["shenzhen","SZX"],"廣州":["guangzhou","CAN"],"三亞":["sanya","SYX"],"三亚":["sanya","SYX"],"杭州":["hangzhou","HGH"],"成都":["chengdu","CTU"],
  "杜拜":["dubai","DXB"],"迪拜":["dubai","DXB"],"馬爾地夫":["maldives","MLE"],"马尔代夫":["maldives","MLE"],
  "倫敦":["london","LON"],"巴黎":["paris","PAR"],"紐約":["new york","NYC"],"洛杉磯":["los angeles","LAX"],"舊金山":["san francisco","SFO"],
  "雪梨":["sydney","SYD"],"悉尼":["sydney","SYD"],"墨爾本":["melbourne","MEL"],"夏威夷":["hawaii","maui","waikiki","kauai"],"檀香山":["honolulu","waikiki","HNL"],
  "冰島":["iceland","reykjavik"],"雷克雅維克":["reykjavik"],
  "萬豪":["marriott"],"万豪":["marriott"],"JW萬豪":["jw marriott"],"喜來登":["sheraton"],"喜来登":["sheraton"],"威斯汀":["westin"],
  "麗思卡爾頓":["ritz-carlton","ritz carlton"],"丽思卡尔顿":["ritz-carlton","ritz carlton"],"麗思":["ritz"],"瑞吉":["st. regis","st regis"],
  "豪華精選":["luxury collection"],"艾迪遜":["edition"],"寶格麗":["bulgari"],"萬麗":["renaissance"],"萬怡":["courtyard"],"万怡":["courtyard"],
  "雅樂軒":["aloft"],"福朋":["four points"],"艾美":["le meridien","méridien"],"傲途格":["autograph"],"臻品之選":["tribute"],"源宿":["element"],
  "萬楓":["fairfield"],"萬豪酒店式公寓":["residence inn"],"德爾塔":["delta"],"盖洛德":["gaylord"],"W酒店":["w "],"Moxy":["moxy"],
  "洲際":["intercontinental"],"金普頓":["kimpton"],"英迪格":["indigo"],"皇冠假日":["crowne plaza"],"假日":["holiday inn"],"華邑":["hualuxe"],
  "麗晶":["regent"],"六善":["six senses"],"逸衡":["voco"],"智選假日":["holiday inn express"]
};
/* 飯店的中文名：由英文名裡的城市＋品牌對照 ALIAS 組成（不是官方譯名） */
const ZH_MAP = (()=>{
  const city=[], brand=[], seen=new Set(), keys=Object.keys(ALIAS), split=keys.indexOf("萬豪");
  keys.forEach((k,i)=>{ const t=ALIAS[k][0].trim().toLowerCase();
    if (seen.has(t) || !/[一-鿿]/.test(k)) return;
    seen.add(t); (i<split?city:brand).push([t,k]); });
  const sort = a => a.sort((x,y)=>y[0].length-x[0].length);
  return {city:sort(city), brand:sort(brand)};
})();
function zhName(name){
  const nl = name.toLowerCase();
  const hit = a => { for (const [t,k] of a){ const i=nl.indexOf(t); if (i>=0 && !/[a-z]/.test(nl[i-1]||"") && !/[a-z]/.test(nl[i+t.length]||"")) return k; } return ""; };
  const c = hit(ZH_MAP.city), b = hit(ZH_MAP.brand);
  return {zh:c+b, full:!!(c&&b)};
}

/* ---------- 資料載入 ---------- */
async function loadData(){
  if (EMBED) { DATA = EMBED; return; }
  try { const r = await fetch("data.json?t="+Date.now()); if (r.ok) DATA = await r.json(); } catch(e) {}
}
async function loadWatchlist(){
  const h = {"Accept":"application/vnd.github+json"};
  if (token()) h.Authorization = "Bearer "+token();
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${WL_PATH}?ref=main&t=${Date.now()}`, {headers:h, cache:"no-store"});
    if (r.ok) {
      const j = await r.json(); WL_SHA = j.sha;
      WL = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")), c=>c.charCodeAt(0))));
      WL.hotels ||= []; WL.monitors ||= [];
      return true;
    }
  } catch(e) {}
  // 讀不到就用 data.json 的內容
  WL = {hotels: DATA.hotels.map(h=>({id:h.id, chain:h.chain_id||"", code:h.code||"", name:h.name, city:h.city, mode:h.mode})),
        monitors: DATA.monitors.map(m=>({hotel:m.hotel, date:m.date, max_price:m.max}))};
  return false;
}
async function saveWatchlist(mutate, msg){
  if (!token()) { openSettings("要新增或修改，請先在設定貼上 GitHub token"); return false; }
  for (let attempt=0; attempt<2; attempt++){
    const ok = await loadWatchlist();
    if (!ok) { toast("讀不到 GitHub 清單，請檢查 token"); return false; }
    const next = JSON.parse(JSON.stringify(WL));
    mutate(next);
    const body = { message: msg, branch:"main", sha: WL_SHA,
      content: btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(next, null, 1)))) };
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${WL_PATH}`, {method:"PUT",
      headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token(),"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (r.ok) { const j=await r.json(); WL = next; WL_SHA = j.content.sha; renderAll(); toast("已儲存，下次抓價會套用"); return true; }
    if (r.status === 409) continue;
    toast(r.status===401||r.status===403 ? "token 無效或權限不足" : "儲存失敗（"+r.status+"）"); return false;
  }
  toast("儲存衝突，請重試"); return false;
}
async function loadDir(){
  if (DIR) return DIR;
  const get = async f => { try { const r = await fetch(f); return r.ok ? await r.json() : []; } catch(e) { return []; } };
  const [mar, ihg] = await Promise.all([get("hotels-marriott.json"), get("hotels-ihg.json")]);
  DIR = [...mar.map(([c,n])=>[c,n,"marriott",""]),
         ...ihg.map(([c,b,city])=>[c, `${IHG_BRAND[b]||titleCase(b.replace(/-/g," "))} ${titleCase(city.replace(/-/g," "))}`, "ihg", `${b}/hotels/us/en/${city}/${c.toLowerCase()}`])];
  return DIR;
}

/* ---------- 共用 ---------- */
const wlHotel = id => WL.hotels.find(h=>h.id===id);
const dataHotel = id => DATA.hotels.find(h=>h.id===id);
const hotelName = id => (wlHotel(id)||dataHotel(id)||{name:id}).name;
function monState(m){
  const dm = DATA.monitors.find(x=>x.hotel===m.hotel && x.date===m.date && x.max===m.max_price);
  if (m.date < todayStr) return {state:"expired", dm};
  if (dm && dm.state==="done") return {state:"done", dm};
  return {state: dm ? "watch" : "pending", dm};
}
function minOf(h){
  if (!h) return null;
  const ok = Object.entries(h.days||{}).filter(([d,x])=>d>=todayStr && metric(x)!=null);
  if (!ok.length) return null;
  const min = Math.min(...ok.map(([,x])=>metric(x)));
  return {min, unit: PMODE==="cash" ? "NT$" : ok[0][1].u, dates: ok.filter(([,x])=>metric(x)===min).map(([d])=>d)};
}

/* ---------- 搜尋 ---------- */
function parseUrl(q){
  let m = q.match(/marriott\.com\/[^ ]*hotels\/([a-z0-9]{5})-([a-z0-9-]+)/i);
  if (m) return {chain:"marriott", code:m[1].toUpperCase(), name:m[2].replace(/-/g," ")};
  m = q.match(/ihg\.com\/([a-z-]+\/hotels\/[a-z]{2}\/[a-z]{2}\/[a-z0-9-]+)\/([a-z0-9]{5})\//i);
  if (m) return {chain:"ihg", code:m[2].toUpperCase(), ihg_path:`${m[1]}/${m[2].toLowerCase()}`.toLowerCase()};
  return null;
}
async function doSearch(){
  const raw = $("#q").value.trim();
  const box = $("#results");
  if (!raw){ box.classList.add("hide"); return; }
  box.classList.remove("hide");
  const fromUrl = parseUrl(raw);
  if (fromUrl){ box.innerHTML = addForm(fromUrl); bindAddForm(); return; }
  box.innerHTML = '<div class="empty-note">搜尋中…</div>';
  const dir = await loadDir();
  // 中文轉英文關鍵字
  let terms = [], iata = [];
  let rest = raw;
  Object.keys(ALIAS).sort((a,b)=>b.length-a.length).forEach(k=>{
    if (rest.includes(k)) { rest = rest.replace(k," "); ALIAS[k].forEach(t=> /^[A-Z]{3}$/.test(t) ? iata.push(t) : terms.push(t.toLowerCase())); }
  });
  rest.split(/\s+/).filter(Boolean).forEach(t=>terms.push(t.toLowerCase()));
  const code = /^[A-Za-z0-9]{5}$/.test(raw) ? raw.toUpperCase() : null;
  // 城市詞（含 IATA）與其他詞分開：城市任一符合即可，其他詞全部要符合
  const cityTerms = [], otherTerms = [];
  terms.forEach(t => (Object.values(ALIAS).some(v=>v[0]===t) && !["marriott","sheraton","westin"].includes(t) && Object.entries(ALIAS).some(([k,v])=>v.includes(t) && v.some(x=>/^[A-Z]{3}$/.test(x)))) ? cityTerms.push(t) : otherTerms.push(t));
  let res = dir.filter(([c,n])=>{
    const nl = n.toLowerCase();
    if (code && c===code) return true;
    const cityOk = !cityTerms.length && !iata.length ? true :
      cityTerms.some(t=>nl.includes(t)) || iata.some(i=>c.startsWith(i));
    const otherOk = otherTerms.every(t=>nl.includes(t) || c.toLowerCase()===t);
    return cityOk && otherOk && (cityTerms.length+iata.length+otherTerms.length>0);
  });
  let html = "";
  if (code && !res.some(([c])=>c===code)) html += addForm({chain:"ihg", code});
  res = [...res.filter(r=>r[2]==="marriott").slice(0,40), ...res.filter(r=>r[2]==="ihg").slice(0,40)].filter(r=>DIRCHAIN==="all"||r[2]===DIRCHAIN);
  html += res.length ? res.map(([c,n,chain,path])=>{
      const have = WL.hotels.some(h=>h.code===c && h.chain===chain), z = zhName(n);
      return `<div class="row"><div class="main"><div class="t">${esc(z.zh||n)}</div><div class="s"><span class="badge">${CHAIN[chain]}</span>${c}${z.zh?" · "+esc(n):""}</div></div>
        ${have ? '<span class="muted" style="font-size:13px">已收藏</span>' : `<button class="btn pri" data-add="${c}" data-name="${esc(z.full?z.zh:n)}" data-chain="${chain}" data-path="${esc(path)}">收藏</button>`}</div>`;
    }).join("") : (code ? "" : '<div class="empty-note">找不到符合的飯店。可輸入 5 碼代碼或貼上官網網址。</div>');
  box.innerHTML = html;
  box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addHotel({chain:b.dataset.chain, code:b.dataset.add, name:b.dataset.name, ihg_path:b.dataset.path}, b));
  bindAddForm();
}
function addForm(h){
  return `<div class="row" style="flex-wrap:wrap"><div class="main"><div class="t">新增 ${CHAIN[h.chain]||h.chain} 飯店 ${esc(h.code)}</div>
    <div class="s">請輸入顯示名稱${h.chain==="ihg"?"（IHG 代碼可在官網飯店網址中找到，例如 …/taipei/<b>tpepi</b>/hoteldetail）":""}</div></div>
    <div class="field" style="width:100%;margin-top:6px"><input id="addName" placeholder="例如：台北洲際" value="${esc(h.name?titleCase(h.name):"")}">
    <button class="btn pri" id="addGo" data-chain="${h.chain}" data-code="${esc(h.code)}" data-path="${esc(h.ihg_path||"")}">收藏</button></div></div>`;
}
function titleCase(s){ return s.replace(/\b\w/g,c=>c.toUpperCase()); }
function bindAddForm(){
  const b = $("#addGo"); if (!b) return;
  b.onclick = () => {
    const name = $("#addName").value.trim() || b.dataset.code;
    const h = {chain:b.dataset.chain, code:b.dataset.code, name};
    if (b.dataset.path) h.ihg_path = b.dataset.path;
    addHotel(h, b);
  };
}
async function addHotel(h, btn){
  if (btn) btn.disabled = true;
  const id = `${h.chain}-${h.code}`.toLowerCase();
  const rec = {id, chain:h.chain, code:h.code, name:h.name, mode:"points", alert_drop:true, drop_min:2000};
  if (h.ihg_path) rec.ihg_path = h.ihg_path;
  const ok = await saveWatchlist(w=>{ if (!w.hotels.some(x=>x.id===id || (x.chain===h.chain && x.code===h.code))) w.hotels.push(rec); }, `收藏 ${h.name}`);
  if (ok) { toast(h.chain==="ihg" ? "已收藏，打開日曆就會查價" : "已收藏，約 30 分鐘內有資料"); doSearch(); } else if (btn) btn.disabled = false;
}

/* ---------- 日曆 ---------- */
function addMonths(ym, n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${String(m).padStart(2,"0")}`; }
function horizonStr(days){ const d=new Date(todayStr+"T00:00"); d.setDate(d.getDate()+days); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function isStale(x){ if (!x || !x.h || !x.h.length) return true; const last=x.h[x.h.length-1][0]; return last < horizonStr(-1); }
function monthNeedsFetch(hid, ym){
  // 沒資料或超過一天沒更新就需要查（完整更新每週才一次，平常靠打開頁面補）
  const h = dataHotel(hid), days = h ? h.days : {};
  const [y,m] = ym.split("-").map(Number), n = new Date(y,m,0).getDate();
  let need = 0, total = 0;
  for (let d=1; d<=n; d++){ const k=`${ym}-${String(d).padStart(2,"0")}`; if (k<todayStr) continue; total++; if (isStale(days[k])) need++; }
  return total>0 && need>total/3;
}
function renderCal(){
  const list = WL.hotels.length ? WL.hotels : DATA.hotels;
  if (!list.find(h=>h.id===curHotel)) curHotel = list[0] ? list[0].id : "";
  $("#chips").innerHTML = list.map(h=>`<button class="chip ${h.id===curHotel?"on":""}" data-id="${h.id}">${esc(h.name)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ curHotel=c.dataset.id; LS.set("hm-hotel",curHotel); closeSheet(); renderCal(); maybeFetchMonth(); });
  if (!curHotel){ $("#sum").innerHTML='<div class="empty-note" style="grid-column:1/-1">先到「搜尋收藏」加入飯店</div>'; $("#cal").innerHTML=""; renderStatus(); return; }
  const wh = wlHotel(curHotel) || {}, h = dataHotel(curHotel);
  const days = h ? h.days : {};
  const ok = Object.entries(days).filter(([d,x])=>d>=todayStr && metric(x)!=null);
  const prices = ok.map(([,x])=>metric(x));
  const min = prices.length ? Math.min(...prices) : null, max = prices.length ? Math.max(...prices) : null;
  const lowCut = min!=null ? min + (max-min)*0.2 : null;
  const unit = ok.length ? ok[0][1].u : "pts";
  const mons = new Set(WL.monitors.filter(m=>m.hotel===curHotel && !["expired","done"].includes(monState(m).state)).map(m=>m.date));
  const best = ok.filter(([,x])=>metric(x)===min).map(([d])=>d);
  const vr = h && h.value_range;
  $("#sum").innerHTML = `<div><div class="name">${esc(wh.name||h?.name||curHotel)}</div>
      <div class="meta">${CHAIN[wh.chain]||h?.chain||""} ${esc(wh.code||h?.code||"")}${h&&h.last?(isMarriott(curHotel)?" · 讀取 ":" · 抓取 ")+esc(h.last):" · 等待第一次抓價"}</div>
      ${vr?`<div class="meta">每萬點價值 NT$ ${vr[0].toLocaleString()}–${vr[1].toLocaleString()}</div>`:""}</div>
    <div class="best">${min!=null?`<div class="meta">已查日期最低${PMODE==="cash"?"現金":""}</div><b>${PMODE==="cash"?twd(min):fmt(min,unit)}</b><div class="meta">${best.slice(0,3).map(d=>d.slice(5)).join("、")}${best.length>3?" 等":""}</div>`:""}</div>`;
  const minM = todayStr.slice(0,7), maxM = addMonths(minM, MAX_MONTHS);
  if (curMonth < minM) curMonth = minM; if (curMonth > maxM) curMonth = maxM;
  const [y, mo] = curMonth.split("-").map(Number), m = mo-1;
  const lim = horizonStr(DAYS_AHEAD-1);
  let html = `<div class="monthbar"><button id="mPrev" ${curMonth<=minM?"disabled":""} aria-label="上個月">‹</button>
    <h2>${y} 年 ${mo} 月</h2><button id="mNext" ${curMonth>=maxM?"disabled":""} aria-label="下個月">›</button></div><div class="grid">` +
    ["日","一","二","三","四","五","六"].map((w,i)=>`<div class="dow ${i===0||i===6?"we":""}">${w}</div>`).join("");
  const first = new Date(y,m,1).getDay(), n = new Date(y,m+1,0).getDate();
  for (let i=0;i<first;i++) html += '<div class="cell blank"></div>';
  for (let d=1; d<=n; d++){
    const key = `${curMonth}-${String(d).padStart(2,"0")}`;
    const wd = (first+d-1)%7, x = days[key];
    let cls = "cell"+(wd===0||wd===6?" we":"")+(mons.has(key)?" mon":"")+(key===selDay?" sel":"");
    if (key < todayStr){ html += `<div class="${cls} past"><span class="d">${d}</span></div>`; continue; }
    let p="", c="", q="";
    if (x){
      if (x.s==="sold_out" || x.s==="premium") { c = '<span class="sold">搶空</span>'; if (PMODE!=="points" && x.c) q = kfmt(x.c); }
      else if (x.s==="ok" && x.p!=null){
        const pts = x.g ? `<b>${x.p}</b>` : String(x.p);
        if (PMODE==="cash") p = x.c!=null ? x.c.toLocaleString() : '<span class="na">–</span>';
        else p = pts;
        if (PMODE==="both") q = x.c!=null ? "$"+kfmt(x.c) : "";
        const mv = metric(x);
        if (mv!=null){ if (mv===min) cls += " lowest"; else if (mv<=lowCut) cls += " low"; }
        if (PMODE!=="cash"){
          if (x.new) c = '<span class="down">新開</span>';
          else if (x.delta>0) c = `<span class="up">漲${x.delta.toLocaleString()}</span>`;
          else if (x.delta<0) c = `<span class="down">降${(-x.delta).toLocaleString()}</span>`;
        }
      }
    } else if (key > lim) { p = '<span class="na">–</span>'; }
    html += `<button class="${cls}" data-k="${key}"><span class="d">${d}</span><span class="p">${p}</span>${q?`<span class="q">${q}</span>`:""}<span class="c">${c}</span></button>`;
  }
  html += "</div>";
  $("#cal").innerHTML = html;
  $("#cal").querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>openDay(b.dataset.k));
  $("#mPrev").onclick = () => { curMonth = addMonths(curMonth,-1); closeSheet(); renderCal(); maybeFetchMonth(); };
  $("#mNext").onclick = () => { curMonth = addMonths(curMonth, 1); closeSheet(); renderCal(); maybeFetchMonth(); };
  renderStatus();
}

/* ---------- 請電腦即時更新 ---------- */
let PENDING = (()=>{ try { return JSON.parse(LS.get("hm-pending","[]")); } catch(e){ return []; } })();
function savePending(){ LS.set("hm-pending", JSON.stringify(PENDING)); }
function renderStatus(){
  const el = $("#status"); if (!el) return;
  const mine = PENDING.filter(p=>p.hotel===curHotel || p.type==="open");
  if (LIVE_JOBS.length){
    el.className = "status busy";
    el.innerHTML = `<span class="dot"></span>查詢中：${LIVE_JOBS.map(j=>`${esc(hotelName(j.hid))} ${j.done}/${j.total}`).join("、")}`;
  } else if (PENDING.length){

      : `<span class="dot"></span>更新中：${esc(what)}（已送出 ${mins} 分鐘${p.type==="daily"?"":"，萬豪一個月約需 8 分鐘"}）`;
  } else if (isMarriott(curHotel)) {

    el.className = "status"; el.textContent = `萬豪監控日期每 8 小時查官網一次，其他日期來自 ustatz（PY的旅行大小事），每天讀取一次${h&&h.last?"，上次讀取 "+h.last.slice(5):""}（不是對方的資料時間）。訂房前請到官網確認`;
  } else if (curHotel && !isLive(curHotel) && monthNeedsFetch(curHotel, curMonth)) {

    const t = $("#needTok"); if (t) t.onclick = e => { e.preventDefault(); openSettings(); };

async function sendRequest(req){
  if (!token()) return false;
  req.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  req.t = Date.now();
  const h = {"Accept":"application/vnd.github+json","Authorization":"Bearer "+token()};
  for (let attempt=0; attempt<3; attempt++){
    let list = [], sha;
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${REQ_PATH}?ref=main&t=${Date.now()}`, {headers:h, cache:"no-store"});
    if (r.ok){ const j = await r.json(); sha = j.sha;
      try { list = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")), c=>c.charCodeAt(0)))); } catch(e){ list = []; } }
    else if (r.status !== 404) return false;
    list = list.filter(x => Date.now() - x.t < 6*3600*1000).slice(-30);
    list.push(req);
    const body = {message:`更新請求 ${req.type} ${req.month||""}`, branch:"main",
      content: btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(list))))};
    if (sha) body.sha = sha;
    const w = await fetch(`https://api.github.com/repos/${REPO}/contents/${REQ_PATH}`, {method:"PUT", headers:{...h,"Content-Type":"application/json"}, body:JSON.stringify(body)});
    if (w.ok){ PENDING.push(req); savePending(); renderStatus(); watchPending(); return true; }
    if (w.status !== 409 && w.status !== 422) return false;
  }
  return false;
}
function recentlyRequested(key, ms){ const t = +LS.get(key, 0); return Date.now()-t < ms; }

function addDay(k, n){ const d=new Date(k+"T00:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function stamp(t){ const d=new Date(t); return `${addDay(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,0)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function nextDays(id){ const ds=[]; for (let i=0;i<DAYS_AHEAD;i++) ds.push(addDay(todayStr,i)); return [...new Set([...ds, ...WL.monitors.filter(m=>m.hotel===id).map(m=>m.date)])]; }

async function ihgQuote(code, d){
  const co = addDay(d,1);
  const body = {products:[{productCode:"SR",guestCounts:[{otaCode:"AQC10",count:DATA.adults||2},{otaCode:"AQC8",count:0}],startDate:d,endDate:co,quantity:1}],
    startDate:d,endDate:co,hotelMnemonics:[code],rates:{ratePlanCodes:[{internal:"IVANI"}]},
    options:{disabilityMode:"ACCESSIBLE_AND_NON_ACCESSIBLE",returnAdditionalRatePlanDescriptions:false}};
  const r = await fetch("https://apis.ihg.com/availability/v3/hotels/offers?fieldset=rateDetails", {method:"POST",
    headers:{"content-type":"application/json","x-ihg-api-key":IHG_KEY,"accept-language":"en-US"}, body:JSON.stringify(body)});

  const pts = offers.filter(o=>o.ratePlanCode==="IVANI").map(o=>{ const po=(o.rewardNights||{}).pointsOnly||{}; return +(po.totalPoints||po.averageDailyPoints||0); }).filter(Boolean);

/* 查一批日期；連續失敗 3 次就停止，回傳是否成功 */
async function liveFetch(hid, dates){
  const wh = wlHotel(hid)||dataHotel(hid);
  const todo = dates.filter(d=>d>=todayStr && !INFLIGHT.has(hid+d));
  if (!todo.length) return true;
  todo.forEach(d=>INFLIGHT.add(hid+d));
  const job = {hid, done:0, total:todo.length}; LIVE_JOBS.push(job); renderStatus();
  const out = (LIVE[hid] ||= {});
  let i=0, fails=0;
  const worker = async () => {
    while (i<todo.length && fails<3){
      const d = todo[i++];
      try { out[d] = {...await ihgQuote(wh.code, d), t:Date.now()}; fails = 0; } catch(e){ fails++; }
      INFLIGHT.delete(hid+d); job.done++;
      if (job.done%10===0){ applyLive(); renderCal(); } else renderStatus();
    }
  };
  await Promise.all(Array.from({length:LIVE_WORKERS}, worker));
  todo.forEach(d=>INFLIGHT.delete(hid+d));
  LIVE_JOBS.splice(LIVE_JOBS.indexOf(job),1);
  saveLive(); applyLive(); renderAll();
  return fails<3;
}

  for (let d=1; d<=new Date(y,m,0).getDate(); d++) ds.push(`${ym}-${String(d).padStart(2,"0")}`);
  if (await liveFetch(hid, ds)) return;

}
function saveLive(){

  for (const ov of Object.values(LIVE)) for (const [d,e] of Object.entries(ov)) if (d<todayStr || now-e.t>LIVE_KEEP) delete ov[d];

/* 把網頁查到的結果蓋到 DATA 上（比電腦資料舊的不蓋），規則同 report.py */
function applyLive(){
  for (const [hid,ov] of Object.entries(LIVE)){
    const w = wlHotel(hid)||dataHotel(hid); if (!w) continue;
    let h = dataHotel(hid);
    if (!h){ h = {id:hid,name:w.name,chain:CHAIN[w.chain]||w.chain,chain_id:w.chain,code:w.code,city:w.city||"",mode:"points",last:null,days:{},value_range:null,value_good:null}; DATA.hotels.push(h); }
    let newest = 0;
    for (const [d,e] of Object.entries(ov)){
      if (d<todayStr) continue;
      const prev = h.days[d], st = stamp(e.t), day = st.slice(0,10), fd = prev&&prev.h&&prev.h.length ? prev.h[prev.h.length-1][0] : "";
      if (fd>day || (fd===day && (h.last||"")>st)) continue;
      let delta = null, isNew = false;
      if (prev && e.s==="ok"){
        if (prev.p===e.p){ delta = prev.delta??null; isNew = !!prev.new; }
        else if (prev.s==="ok" && prev.p!=null) delta = e.p-prev.p;
        else if (prev.s==="sold_out") isNew = true;
      }
      h.days[d] = {...prev, p:e.p, s:e.s, u:e.u, n:e.n||"", cn:e.cn??null, cu:e.cu??null, c:toTwd(e.cn,e.cu), delta, new:isNew,
        url:(prev&&prev.url)||ihgUrl(w,d), h:((prev&&prev.h)||[]).filter(r=>r[0]!==day).concat([[day,e.p,e.s]])};
      newest = Math.max(newest, e.t);
    }
    if (newest){ h.last = stamp(newest); recalcHotel(h); }
  }
}
function recalcHotel(h){
  const days = Object.entries(h.days).filter(([d])=>d>=todayStr).map(([,x])=>x);
  const oks = days.filter(x=>(x.s==="ok"||x.s==="premium") && x.p).map(x=>x.p).sort((a,b)=>a-b), n = oks.length;
  const cap = h.standard_max || (n>=5 ? (n%2 ? oks[(n-1)/2] : (oks[n/2-1]+oks[n/2])/2)*1.7 : null);
  for (const x of days){
    if (x.s==="ok" || x.s==="premium"){ x.s = cap && x.p>cap ? "premium" : "ok"; if (x.s==="premium"){ x.delta=null; x.new=false; } }
    x.v = x.c && x.s==="ok" && x.p ? Math.round(x.c/x.p*10000) : null;
  }
  const vals = days.filter(x=>x.v).map(x=>x.v).sort((a,b)=>a-b);
  const good = h.value_good_cfg || (vals.length>=8 ? vals[Math.floor(vals.length*0.75)] : null);
  for (const x of days) x.g = !!(good && x.v && x.v>=good);
  h.value_range = vals.length ? [vals[0], vals[vals.length-1]] : null; h.value_good = good;
}

function spark(hist){

  const xy = pts.map((r,i)=>[pad+i*(W-2*pad)/(pts.length-1), H-pad-(hi===lo?0.5:(r[1]-lo)/(hi-lo))*(H-2*pad)]);
  const d = xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const lp = xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}

    const {state, dm} = monState(m);
    const h = dataHotel(m.hotel), x = h && h.days[m.date];
    const cur = x ? (x.s==="ok" ? fmt(x.p,x.u) : "搶空") : (dm && dm.cur!=null ? fmt(dm.cur, dm.unit) : "-");
    return `<div class="row"><div class="main" data-goto="${i}" style="cursor:pointer">
        <div class="t">${m.date.slice(5)}　${esc(hotelName(m.hotel))}</div>
        <div class="s">門檻 &lt; ${m.max_price.toLocaleString()}　目前 ${cur}${dm&&dm.done_at?"　完成 "+esc(dm.done_at.slice(5)):""}</div></div>
      <span class="tag ${state}">${st[state]}</span>
      <button class="btn ghost danger" data-mdel="${i}" aria-label="刪除">✕</button></div>`;
  }).join("");
  $("#mon").querySelectorAll("[data-goto]").forEach(e=>e.onclick=()=>{ const m=list[+e.dataset.goto]; curHotel=m.hotel; LS.set("hm-hotel",curHotel); curMonth=m.date.slice(0,7); show("cal"); renderCal(); openDay(m.date); });
  $("#mon").querySelectorAll("[data-mdel]").forEach(e=>e.onclick=()=>{
    const m = list[+e.dataset.mdel];
    if (!confirm(`刪除 ${m.date} ${hotelName(m.hotel)} 的監控？`)) return;
    saveWatchlist(w=>{ w.monitors = w.monitors.filter(x=>!(x.hotel===m.hotel && x.date===m.date)); }, `刪除監控 ${hotelName(m.hotel)} ${m.date}`);
  });
}

/* ---------- 優惠 ---------- */
function renderDeals(){
  $("#deal").innerHTML = (DATA.deals||[]).length ? DATA.deals.map(d=>`<a class="deal" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.title)}${d.summary?`<small>${esc(d.summary)}</small>`:""}<small>${esc(d.source)} · ${esc(d.seen)}</small></a>`).join("")
    : '<div class="empty-note">目前沒有符合關鍵字的優惠文章</div>';
}

/* ---------- 設定 ---------- */
function openSettings(msg){
  const has = !!token();
  openSheet(`<h3>設定</h3>
    ${msg?`<div class="banner">${esc(msg)}</div>`:""}
    <div class="sec-title" style="margin-top:14px">GitHub token <small>${has?"已設定":"未設定"}</small></div>
    <div class="hint">新增、刪除收藏與監控需要 token（只存在這支手機的瀏覽器，不會上傳到網頁）。權限：只選 hotel-monitor repo，Contents 設為 Read and write。
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">建立 token</a></div>
    <div class="field"><input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" value=""></div>
    <div class="btns">${has?'<button class="btn danger" id="tokDel">移除 token</button>':""}<button class="btn pri" id="tokSave">儲存並測試</button></div>
    <div class="sec-title" style="margin-top:18px">資料更新</div>
    <div class="hint">IHG 由這個網頁直接查官網（不用 token，也不用開電腦），結果只存在這個瀏覽器，同一個月 15 分鐘內不重複查。萬豪由電腦每 8 小時查一次官網（只查監控日期，被封鎖就等隔天），並每天 07:00 後讀一次 ustatz（PY的旅行大小事）約 11 個月的資料，對方資料不一定最新、現金為含稅價，訂房前請到官網確認；切換月份只看已存的資料。LINE 通知一律由電腦發送。「立即完整更新」只查 IHG。</div>
    <div class="btns"><button class="btn" id="btnDaily">立即完整更新</button></div>
    <div class="btns"><button class="btn" id="sheetClose">關閉</button></div>`);
  $("#sheetClose").onclick = closeSheet;
  $("#btnDaily").onclick = requestDaily;
  $("#tokSave").onclick = async () => {
    const v = $("#tok").value.trim(); if (!v) { toast("請貼上 token"); return; }
    const r = await fetch(`https://api.github.com/repos/${REPO}`, {headers:{"Authorization":"Bearer "+v,"Accept":"application/vnd.github+json"}});
    if (!r.ok) { toast("token 無效"); return; }
    const j = await r.json();
    if (!(j.permissions && j.permissions.push)) { toast("token 沒有寫入權限"); return; }
    LS.set("hm-token", v); toast("token 已儲存"); closeSheet(); await loadWatchlist(); renderAll();
  };
  if ($("#tokDel")) $("#tokDel").onclick = () => { try{ localStorage.removeItem("hm-token"); }catch(e){} toast("已移除"); closeSheet(); };
}
$("#btnSettings").onclick = () => openSettings();

/* ---------- 啟動 ---------- */
function renderAll(){ renderFavs(); renderCal(); renderMon(); renderDeals(); $("#upd").textContent = DATA.updated ? "更新 "+DATA.updated.slice(5) : ""; }
document.querySelectorAll("#pmode button").forEach(b=>b.onclick=()=>setPmode(b.dataset.m));
document.querySelectorAll("#dirchain button").forEach(b=>{ b.onclick=()=>setDirchain(b.dataset.c); b.classList.toggle("on", b.dataset.c===DIRCHAIN); });
let qTimer; $("#q").addEventListener("input", ()=>{ clearTimeout(qTimer); qTimer=setTimeout(doSearch, 250); });
(async () => {
  await loadData();
  await loadWatchlist();
  applyLive();
  document.querySelectorAll("#pmode button").forEach(b=>b.classList.toggle("on", b.dataset.m===PMODE));
  show(view);
  renderAll();
  watchPending();
  requestOnOpen();
  if (view==="cal") maybeFetchMonth();
})();
</script>
</body>
</html>
